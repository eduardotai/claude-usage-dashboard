name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check (server + UI)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test the packaged CLI
        shell: bash
        run: |
          npm pack
          SMOKE="${RUNNER_TEMP:-/tmp}/smoke"
          mkdir -p "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/burnboard-*.tgz
          FX="$GITHUB_WORKSPACE/test/fixtures"
          BURNBOARD_OFFLINE=1 npx burnboard --no-open --port 4417 --claude-dir "$FX/claude" \
            --codex-home "$FX/codex/home" --grok-home "$FX/grok/home" --cursor-csv "$FX/cursor/imports/cursor" --grok-csv "$FX/grok-unified" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4417/api/health && break; sleep 1; done
          curl -sf "http://127.0.0.1:4417/api/stats/summary?agent=claude-code" | grep -q '"total_messages":6'
          curl -sf http://127.0.0.1:4417/api/stats/summary | grep -q '"total_agents":6'
          curl -sf "http://127.0.0.1:4417/api/stats/summary?agent=grok-bot" | grep -q '"charged_records":2'
          curl -sf http://127.0.0.1:4417/ | grep -qi '<html'
          echo "smoke OK"
